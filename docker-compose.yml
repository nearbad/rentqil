services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rentqil}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rentqil}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rentqil}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: production
      TZ: ${TZ:-Asia/Tashkent}
      WEB_URL: ${WEB_URL:?set WEB_URL in .env}
      # the mock psp posts webhooks back to the api itself
      API_URL: http://localhost:3001
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      MOCK_WEBHOOK_SECRET: ${MOCK_WEBHOOK_SECRET:?set MOCK_WEBHOOK_SECRET in .env}
      ADMIN_PHONE: ${ADMIN_PHONE:-+998900000000}
      ESKIZ_EMAIL: ${ESKIZ_EMAIL:-}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD:-}
    ports:
      - '3001:3001'

  web:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
      args:
        # public api url as seen from the browser
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:?set EXPO_PUBLIC_API_URL in .env}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '80:80'

volumes:
  pgdata:
